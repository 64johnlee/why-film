<!doctype html><title>bridge</title>
<button id="open" style="font-size:28px;padding:20px 40px">OPEN HIGGSFIELD</button>
<button id="send" style="font-size:28px;padding:20px 40px">SEND FILM</button>
<pre id="log">loading film...</pre>
<script>
let file, w;
const log = m => { document.getElementById('log').textContent += '\n' + m; };
(async () => {
  const r = await fetch('/why-film/film/' + (location.hash==='#clean' ? 'WHY_clean.mp4' : 'WHY_submission.mp4'));
  const b = await r.blob();
  file = new File([b], (location.hash==='#clean' ? 'WHY_clean.mp4' : 'WHY_submission.mp4'), { type: 'video/mp4' });
  window.__ready = b.size; log('file ready ' + b.size);
})();
document.getElementById('open').onclick = () => {
  w = window.open('https://higgsfield.ai/generate/@renaissanceruby1570/ai-film-festival', 'hfwin');
  window.__opened = !!w; log('opened ' + !!w);
};
const send = () => { if (!w) w = window.open('', 'hfwin'); w.postMessage({ film: file, size: file.size }, 'https://higgsfield.ai'); log('sent ' + file.size); };
document.getElementById('send').onclick = send;
window.send = send;
</script>
